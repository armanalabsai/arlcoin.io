version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; newer versions stop linting.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Runtime is Node 22 (.nvmrc); types must describe the Node version that runs the code.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @x402/core and @x402/evm (latest 2.28.0) require zod ^3.24.2; the advisory fix exists only in
      # zod 4, so no update can resolve it. The vulnerable zod 4 code is not loaded (see
      # scripts/check-zod-v3-only.mjs, .audit-allowlist.json and docs/security-analysis.md).
      - dependency-name: zod
        versions: [">=4.0.0"]
      # minimatch 3 comes only through the ESLint toolchain (lint at build time, never shipped); its
      # advisory fix is minimatch 11, which no ESLint plugin in use accepts, so no update resolves it.
      - dependency-name: minimatch
        versions: [">=4.0.0"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # eslint-config-next bundles plugins (eslint-plugin-react, -import, -jsx-a11y) that
      # support ESLint 9 at most; ESLint 10 crashes the website lint.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # minimatch 3 comes only through the ESLint toolchain (lint at build time, never shipped); its
      # advisory fix is minimatch 11, which no ESLint plugin in use accepts, so no update resolves it.
      - dependency-name: minimatch
        versions: [">=4.0.0"]

  # Security updates only (no version-update pull requests); the ignore rule applies to them.
  - package-ecosystem: npm
    directory: /apps/dapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # @x402/core and @x402/evm (latest 2.28.0) require zod ^3.24.2; the advisory fix exists only in
      # zod 4, so no update can resolve it. The vulnerable zod 4 code is not loaded (see
      # scripts/check-zod-v3-only.mjs, .audit-allowlist.json and docs/security-analysis.md).
      - dependency-name: zod
        versions: [">=4.0.0"]
      # minimatch 3 comes only through the ESLint toolchain (lint at build time, never shipped); its
      # advisory fix is minimatch 11, which no ESLint plugin in use accepts, so no update resolves it.
      - dependency-name: minimatch
        versions: [">=4.0.0"]
      # deepmerge 4.3.1 comes through RainbowKit's @vanilla-extract/css; no deepmerge release fixes the
      # low advisory, and the app never passes untrusted objects to it.
      - dependency-name: deepmerge
        versions: [">=4.3.2"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init, analyze and upload-sarif must move together: CodeQL fails when their versions differ.
      codeql-action:
        patterns:
          - "github/codeql-action*"
