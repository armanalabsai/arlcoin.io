name: Deploy site (Cloudflare Pages)

# Deploys arlcoin.io to Cloudflare Pages after CI passes on main: the same build as the Vercel
# deploy (scripts/build-site.sh), laid out for Pages by scripts/build-cloudflare.sh, with the
# headers and redirects of apps/web/vercel.json and /api/supply as a Pages Function. See
# docs/cloudflare-pages.md.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown in the Cloudflare dashboard
# and optionally the repository variable CLOUDFLARE_PAGES_PROJECT (default: arlcoin).
# Without the secrets the job skips, and does not fail. It deploys only the website: it holds no
# contract key and never touches a chain.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

# Actions are pinned to full commit SHAs; the tag is noted for review.
jobs:
  deploy:
    # A push to main whose CI passed, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'arlcoin' }}
    steps:
      - name: Skip unless the Cloudflare secrets are set
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The commit CI tested (workflow_run), or the branch the run was started on.
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            package-lock.json
            apps/dapp/package-lock.json

      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        working-directory: apps/web

      # The app under /app: @arl/zk (packages/zk) is linked into it and its dependencies install
      # at the root.
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        working-directory: apps/dapp

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: bash scripts/build-cloudflare.sh "$RUNNER_TEMP/cf"

      # wrangler runs from the stage directory so it finds functions/.
      - name: Deploy to production
        if: steps.secrets.outputs.ready == 'true'
        working-directory: ${{ runner.temp }}/cf
        run: >-
          npx --yes wrangler@4.150.0 pages deploy public
          --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
