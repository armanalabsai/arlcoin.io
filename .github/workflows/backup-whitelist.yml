name: Backup whitelist

# Daily encrypted backup of the whitelist (Cloudflare D1 database `arl-whitelist`, schema in
# db/whitelist/). The export is encrypted to the owner's public key before it is kept, so the
# workflow artifact is unreadable without the owner's private key; the plain export is deleted
# on the runner right after encryption.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    a token limited to "D1: Read" on the account
#   CLOUDFLARE_ACCOUNT_ID   the account id (it appears in the dashboard URL)
#   BACKUP_GPG_PUBLIC_KEY   the owner's ASCII-armoured OpenPGP public key
# Without them the job skips, and does not fail. Restore: download the artifact, then
#   gpg --decrypt whitelist-<date>.sql.gpg > restore.sql
#   npx wrangler@4.40.0 d1 execute arl-whitelist --remote --file restore.sql
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-whitelist
  cancel-in-progress: false

# Actions are pinned to full commit SHAs; the tag is noted for review.
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_GPG_PUBLIC_KEY: ${{ secrets.BACKUP_GPG_PUBLIC_KEY }}
    steps:
      - name: Skip unless the backup secrets are set
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$BACKUP_GPG_PUBLIC_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID or BACKUP_GPG_PUBLIC_KEY is not set; nothing backed up."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export and encrypt
        if: steps.secrets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          umask 077
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          printf '%s\n' "$BACKUP_GPG_PUBLIC_KEY" | gpg --batch --import
          RECIPIENT=$(gpg --batch --with-colons --list-keys | awk -F: '/^fpr:/ {print $10; exit}')
          PLAIN="$RUNNER_TEMP/whitelist.sql"
          OUT="$RUNNER_TEMP/whitelist-$(date -u +%Y-%m-%d).sql.gpg"
          npx --yes wrangler@4.40.0 d1 export arl-whitelist --remote --output "$PLAIN"
          gpg --batch --yes --trust-model always --encrypt --recipient "$RECIPIENT" --output "$OUT" "$PLAIN"
          shred -u "$PLAIN"
          test -s "$OUT"
          echo "BACKUP_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Keep the encrypted backup for 30 days
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whitelist-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
