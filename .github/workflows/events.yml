name: Protocol events

# Protocol event alerts (security hardening S-4): every hour, a read-only scan of the last
# ~70 minutes of the Base Mainnet jobs escrows, verified evaluators and staking contract
# (packages/deploy/src/events-cli.ts, addresses in contracts/deploy/events-8453.json). Disputes,
# slashes, refused refunds, disputes closed without a ruling and failed reputation writes fail
# the run, and GitHub emails the owner; normal activity is listed on the run page. It never signs
# or sends a transaction.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-events
  cancel-in-progress: false

# Actions are pinned to full commit SHAs; the tag is noted for review.
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RPC: ${{ vars.ARL_MAINNET_RPC || 'https://base-rpc.publicnode.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Base makes a block every 2 seconds: 2,100 blocks is 70 minutes, so hourly runs overlap.
      - run: node packages/deploy/src/events-cli.ts contracts/deploy/events-8453.json "$RPC" 2100
