name: Publish npm package

# Builds one of the npm packages (arl-protocol-sdk or arl-protocol-mcp) and publishes it with a
# provenance statement. Started by hand only (Actions tab, "Run workflow"). It uses npm Trusted
# Publishing: npm accepts the upload because this workflow, in this repository, asks for it
# through GitHub's OIDC token, so no npm token is stored anywhere. Each npm package must list this
# workflow as a trusted publisher (armanalabsai, arlcoin.io, publish-npm.yml, environment npm).
# The version published is the one in the package's package.json; bump it in a pull request first.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - sdk
          - mcp

permissions:
  contents: read

# Actions are pinned to full commit SHAs; the tag is noted for review.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Install, test and build
        run: |
          npm ci
          npm test -w "packages/$PACKAGE"
          (cd "packages/$PACKAGE" && node build.ts)
      - name: Publish with provenance
        working-directory: packages/${{ inputs.package }}/dist/package
        run: |
          npm install -g npm@11
          npm publish --provenance --access public
