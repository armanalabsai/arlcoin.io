name: Deploy site

# Deploys arlcoin.io to Vercel production after CI passes on main, with the same steps as
# scripts/deploy-site.sh: a static export of apps/web, the supply API and apps/web/vercel.json,
# uploaded prebuilt with the Vercel CLI. Vercel's own Git builds are turned off
# (apps/web/vercel.json, git.deploymentEnabled), so this workflow is the only automatic deploy.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       a Vercel access token for the alazdg team
#   VERCEL_ORG_ID      the team ID (orgId in .vercel/project.json after `vercel link`)
#   VERCEL_PROJECT_ID  the project ID (projectId in .vercel/project.json)
# Without them the job skips, and does not fail. It deploys only the website: it holds no
# contract key and never touches a chain.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

# Actions are pinned to full commit SHAs; the tag is noted for review.
jobs:
  deploy:
    # A push to main whose CI passed, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Skip unless the Vercel secrets are set
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set; nothing deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The commit CI tested (workflow_run), or the branch the run was started on.
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
        working-directory: apps/web

      - name: Link the Vercel project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" \
            > .vercel/project.json

      - name: Build and deploy to production
        if: steps.secrets.outputs.ready == 'true'
        run: bash scripts/deploy-site.sh
