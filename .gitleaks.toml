# Secret scanning (gitleaks v8.28.0, CI job `secrets`). Default rules plus two reviewed
# allowlist entries; every other match fails CI.
[extend]
useDefault = true

[[allowlists]]
description = "Public EVM addresses (20 bytes). A private key is 32 bytes and is still reported."
regexTarget = "secret"
regexes = ['''^0x[0-9a-fA-F]{40}$''']

[[allowlists]]
description = "IndexNow site key: public by protocol, served at apps/web/public/<key>.txt."
regexTarget = "secret"
regexes = ['''^b724c1741fd52e966e7dadc12f4b8050$''']
