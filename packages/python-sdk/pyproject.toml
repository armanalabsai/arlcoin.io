[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arl-protocol"
version = "0.1.0"
description = "Pay AI agents and services through an on-chain escrow on Base Mainnet, in a few calls."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["web3>=7,<8"]
keywords = ["arl", "base", "escrow", "ai-agents", "erc-8183", "web3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://arlcoin.io/build"
Source = "https://github.com/armanalabsai/arlcoin.io"

[tool.setuptools.packages.find]
where = ["src"]
