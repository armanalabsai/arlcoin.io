[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
# Never read or write outside the project.
fs_permissions = []
# Upstream OpenZeppelin v5.6.1 ECDSA uses `error` as an identifier; solc 0.8.36 warns it will
# become a keyword (6335). Upstream code is not edited, so silence warnings from lib/ only.
ignored_warnings_from = ["lib/"]

[fuzz]
runs = 10000
seed = "0xa121"

[invariant]
runs = 256
depth = 128
fail_on_revert = true

[fmt]
line_length = 100
