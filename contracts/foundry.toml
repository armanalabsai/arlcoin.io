[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "solidity-datetime/=lib/solidity-datetime/contracts/",
]
# Never read or write outside the project.
# Scripts read deployment plans and write deployed addresses; tests read their fixtures.
fs_permissions = [
  { access = "read", path = "./deploy" },
  { access = "read-write", path = "./deploy/deployments" },
  { access = "read", path = "./test/fixtures" },
]
# Upstream OpenZeppelin v5.6.1 ECDSA uses `error` as an identifier; solc 0.8.36 warns it will
# become a keyword (6335). Upstream code is not edited, so silence warnings from lib/ only.
ignored_warnings_from = ["lib/"]

[fuzz]
runs = 10000
seed = "0xa121"

[invariant]
runs = 256
depth = 128
fail_on_revert = true

[fmt]
line_length = 100

# Fork tests against the deployed x402 upto proxy and Permit2 on Base Sepolia (read-only fork,
# nothing is broadcast). Run: FOUNDRY_PROFILE=fork ARL_FORK_RPC=<Base Sepolia RPC> forge test
[profile.fork]
test = "test-fork"

[profile.fork.fuzz]
runs = 256
