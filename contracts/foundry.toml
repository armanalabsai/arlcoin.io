[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "solidity-datetime/=lib/solidity-datetime/contracts/",
]
# Never read or write outside the project.
# Scripts read deployment plans and write deployed addresses; tests read their fixtures.
fs_permissions = [
  { access = "read", path = "./deploy" },
  { access = "read-write", path = "./deploy/deployments" },
  { access = "read", path = "./test/fixtures" },
]
# Upstream OpenZeppelin v5.6.1 ECDSA uses `error` as an identifier; solc 0.8.36 warns it will
# become a keyword (6335). Upstream code is not edited, so silence warnings from lib/ only.
ignored_warnings_from = ["lib/"]

# Zero-knowledge verifier (generated by Barretenberg, zk/) and the tests that use it with real
# proofs (test-zk/). Kept out of the default profile: Slither cannot parse the generated verifier.
#   FOUNDRY_PROFILE=zk forge test
[profile.zk]
src = "zk"
test = "test-zk"

[fuzz]
runs = 10000
seed = "0xa121"

[invariant]
runs = 256
depth = 128
fail_on_revert = true

[fmt]
line_length = 100
# Generated by Barretenberg; kept byte-for-byte so zk/check.sh can compare it.
ignore = ["zk/ARLSemaphoreVerifier.sol"]
