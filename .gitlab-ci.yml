# GitLab CI: the same checks as .github/workflows/ci.yml, for the GitLab repository.
# Foundry is installed from its pinned v1.8.3 release archive and checked by SHA-256.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  NEXT_TELEMETRY_DISABLED: "1"
  FOUNDRY_URL: https://github.com/foundry-rs/foundry/releases/download/v1.8.3/foundry_v1.8.3_linux_amd64.tar.gz
  FOUNDRY_SHA256: 7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568

default:
  image: node:22-bookworm
  interruptible: true

.foundry: &foundry
  - curl -sSfL -o /tmp/foundry.tar.gz "$FOUNDRY_URL"
  - echo "$FOUNDRY_SHA256  /tmp/foundry.tar.gz" | sha256sum -c
  - mkdir -p "$HOME/.foundry/bin" && tar xzf /tmp/foundry.tar.gz -C "$HOME/.foundry/bin"
  - export PATH="$HOME/.foundry/bin:$PATH"
  - forge --version | grep -q cae51ad458f6abb64852b7709eb784352429825d

typescript:
  timeout: 10m
  script:
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm run format:check
    - npm test
    - node scripts/audit.mjs

contracts:
  timeout: 20m
  script:
    - *foundry
    - test "$(git -C contracts/lib/openzeppelin-contracts rev-parse HEAD)" = 5fd1781b1454fd1ef8e722282f86f9293cacf256
    - test "$(git -C contracts/lib/forge-std rev-parse HEAD)" = bf647bd6046f2f7da30d0c2bf435e5c76a780c1b
    - test "$(git -C contracts/lib/solidity-datetime rev-parse HEAD)" = 294fc244973cc5f9ec374713affde12c1403927c
    - cd contracts
    - forge fmt --check
    - forge build --sizes --skip test --skip script
    - forge test -vv
    - forge snapshot --no-match-test "testFuzz|invariant" --no-match-path "test/symbolic/*" --check
    - cd ..
    - node scripts/check-token-abi.mjs

slither:
  image: python:3.12-bookworm
  timeout: 20m
  script:
    - *foundry
    - pip install slither-analyzer==0.11.6
    - cd contracts
    - slither . --foundry-compile-all --filter-paths "lib/|test/" --exclude-dependencies --fail-low

symbolic:
  image: python:3.12-bookworm
  timeout: 20m
  variables:
    FOUNDRY_DYNAMIC_TEST_LINKING: "false"
  script:
    - *foundry
    - pip install halmos==0.3.3
    - cd contracts
    - halmos --match-contract ARLSymbolic --solver-timeout-assertion 120000

rehearsal:
  timeout: 20m
  script:
    - *foundry
    - npm ci
    - (cd contracts && forge build --skip test --skip script)
    - npm run check:bytecode
    - npm run rehearse:local

dapp:
  timeout: 25m
  script:
    - *foundry
    - npm ci
    - cd apps/dapp
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
    - npx playwright install --with-deps chromium
    - npm run test:e2e
    - node ../../scripts/audit.mjs

web:
  timeout: 20m
  script:
    - cd apps/web
    - npm ci
    - npm run typecheck
    - npm run lint
    - npm test
    - npm run build
    - npx playwright install --with-deps chromium
    - npm run test:e2e
    - node ../../scripts/audit.mjs

zk:
  timeout: 25m
  script:
    - *foundry
    # Installer scripts pinned by commit and checked by hash; tool versions pinned.
    - curl -sSfL -o noirup.sh https://raw.githubusercontent.com/noir-lang/noirup/bedac8fbe6a059177c35e565f9f76db54a795976/install
    - echo "89dde59d8ef9e7794d694abca097fa139fa7395b947cb7b0b7a8d1839c737d8b  noirup.sh" | sha256sum -c
    - bash noirup.sh
    - '"$HOME/.nargo/bin/noirup" -v 1.0.0-rc.3'
    - curl -sSfL -o bbup.sh https://raw.githubusercontent.com/AztecProtocol/aztec-packages/f7638fbe5a14c5a5711e9fad78302b121bece294/barretenberg/bbup/install
    - echo "3e4b7ce2d18e7680b897d23de0328ba6365616b2c7d592a5ebb74a368f364efd  bbup.sh" | sha256sum -c
    - bash bbup.sh
    - '"$HOME/.bb/bbup" -v 5.2.0'
    - export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
    - bash zk/check.sh
    - cd contracts
    - FOUNDRY_PROFILE=zk forge build --sizes --skip test
    - FOUNDRY_PROFILE=zk forge test

coverage:
  timeout: 30m
  script:
    - *foundry
    - cd contracts
    - forge coverage --report lcov --report-file lcov-default.info --no-match-coverage "test|lib|script"
    - FOUNDRY_PROFILE=zk forge coverage --report lcov --report-file lcov-zk.info --no-match-coverage "test|lib|zk/"
    - cd ..
    - node scripts/coverage-gate.mjs contracts/lcov-default.info contracts/lcov-zk.info
  artifacts:
    paths: [contracts/lcov-default.info, contracts/lcov-zk.info]
    expire_in: 90 days

secrets:
  timeout: 10m
  variables:
    GIT_DEPTH: 0
    GIT_SUBMODULE_STRATEGY: none
  script:
    - curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
    - echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c
    - tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
    - /tmp/gitleaks git --redact --no-banner --config .gitleaks.toml .

sbom:
  timeout: 10m
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - mkdir -p sbom
    - |
      for dir in . apps/web apps/dapp; do
        name=$([ "$dir" = . ] && echo root || basename "$dir")
        (cd "$dir" && npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only \
          --ignore-npm-errors --output-format JSON --output-file "$CI_PROJECT_DIR/sbom/$name.cdx.json")
        test -s "sbom/$name.cdx.json"
      done
  artifacts:
    paths: [sbom/]
    expire_in: 90 days

# Supplementary analysers (not blockers): results are kept as artifacts and triaged in
# docs/audit-scope.md. Aderyn reports triaged findings, so the job does not fail the pipeline.
aderyn:
  timeout: 20m
  allow_failure: true
  script:
    - *foundry
    - npm i -g @cyfrin/aderyn@0.6.8
    - cd contracts
    - aderyn . --src src -o aderyn-report.md
  artifacts:
    paths: [contracts/aderyn-report.md]
    expire_in: 30 days
